<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 메모장</title>
<!--
  ⚠️ 보안 수업 실습용 페이지입니다. (로컬 전용, 실제 개인정보 없음)
  이전 버전에 있던 3가지 취약점(비밀번호 하드코딩 / innerHTML XSS / console.log 노출)을
  찾아 수정한 버전입니다.
-->
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fdeff9 0%, #eef1ff 50%, #eafcf5 100%);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 12px 30px rgba(180, 170, 230, 0.25);
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #6b5b95;
    margin: 0 0 24px;
  }

  #lock-title {
    text-align: center;
    color: #6b5b95;
    font-size: 0.9rem;
    margin: 0 0 14px;
  }

  #lock-screen input {
    width: 100%;
    border: 2px solid #f0e6f6;
    background: #fbf7fd;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 10px;
  }

  #lock-screen input:focus {
    border-color: #c9b6e4;
  }

  #lock-screen button,
  #memo-screen #add-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px;
    background: #b8a9e0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  #lock-screen button:hover,
  #memo-screen #add-btn:hover {
    background: #a390d6;
  }

  #lock-error {
    color: #c1507a;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
    margin-bottom: 6px;
  }

  #memo-screen {
    display: none;
  }

  #memo-input {
    width: 100%;
    min-height: 70px;
    border: 2px solid #f0e6f6;
    background: #fbf7fd;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.95rem;
    outline: none;
    resize: vertical;
    margin-bottom: 10px;
    font-family: inherit;
  }

  #memo-list {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
  }

  #memo-list li {
    background: #faf6ff;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    color: #5c4b7a;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 비밀 메모장</h1>

    <div id="lock-screen">
      <p id="lock-title">비밀번호를 입력하세요</p>
      <input type="password" id="password-input" placeholder="비밀번호">
      <input type="password" id="confirm-input" placeholder="비밀번호 확인" hidden>
      <p id="lock-error"></p>
      <button id="unlock-btn">잠금 해제</button>
    </div>

    <div id="memo-screen">
      <textarea id="memo-input" placeholder="메모를 입력하세요"></textarea>
      <button id="add-btn">메모 추가</button>
      <ul id="memo-list"></ul>
    </div>
  </div>

<script>
  // ① 비밀번호는 하드코딩하지 않고, 첫 실행 시 사용자가 직접 설정한다.
  // (평문 대신 SHA-256 해시만 로컬에 저장한다)
  const STORAGE_KEY = 'secretMemo.passwordHash';

  const passwordInput = document.getElementById('password-input');
  const confirmInput = document.getElementById('confirm-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const lockScreen = document.getElementById('lock-screen');
  const memoScreen = document.getElementById('memo-screen');
  const lockError = document.getElementById('lock-error');
  const lockTitle = document.getElementById('lock-title');

  const isFirstRun = !localStorage.getItem(STORAGE_KEY);

  function setupMode() {
    lockTitle.textContent = '처음 사용하시네요. 사용할 비밀번호를 설정하세요.';
    confirmInput.hidden = false;
    unlockBtn.textContent = '비밀번호 설정';
  }

  function loginMode() {
    lockTitle.textContent = '비밀번호를 입력하세요';
    confirmInput.hidden = true;
    unlockBtn.textContent = '잠금 해제';
  }

  isFirstRun ? setupMode() : loginMode();

  async function sha256(text) {
    const bytes = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest))
      .map((b) => b.toString(16).padStart(2, '0'))
      .join('');
  }

  function unlock() {
    lockScreen.style.display = 'none';
    memoScreen.style.display = 'block';
    lockError.textContent = '';
  }

  async function handleLockAction() {
    const password = passwordInput.value;
    if (!password) {
      lockError.textContent = '비밀번호를 입력하세요.';
      return;
    }

    if (isFirstRun) {
      if (password.length < 4) {
        lockError.textContent = '비밀번호는 4자 이상으로 설정하세요.';
        return;
      }
      if (password !== confirmInput.value) {
        lockError.textContent = '비밀번호 확인이 일치하지 않습니다.';
        return;
      }
      localStorage.setItem(STORAGE_KEY, await sha256(password));
      unlock();
    } else {
      const inputHash = await sha256(password);
      const storedHash = localStorage.getItem(STORAGE_KEY);
      if (inputHash === storedHash) {
        unlock();
      } else {
        lockError.textContent = '비밀번호가 틀렸습니다.';
      }
    }
  }

  unlockBtn.addEventListener('click', handleLockAction);
  [passwordInput, confirmInput].forEach((input) => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLockAction();
    });
  });

  const memoInput = document.getElementById('memo-input');
  const addBtn = document.getElementById('add-btn');
  const memoList = document.getElementById('memo-list');

  function addMemo() {
    const text = memoInput.value.trim();
    if (!text) return;

    const li = document.createElement('li');
    // ② textContent를 사용해 입력값이 HTML로 해석되지 않고 그대로 텍스트로 표시되게 한다 (XSS 방지)
    li.textContent = text;
    memoList.appendChild(li);

    memoInput.value = '';
  }

  addBtn.addEventListener('click', addMemo);
</script>
</body>
</html>
