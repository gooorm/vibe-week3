<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 메모장</title>
<!--
  ⚠️ 보안 수업 실습용 페이지입니다. (로컬 전용, 실제 개인정보 없음)
  이 파일에는 의도적으로 취약한 코드가 포함되어 있습니다.
  개발자 도구(콘솔/네트워크/소스)를 열어 문제를 스스로 찾아 고쳐보세요.
-->
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fdeff9 0%, #eef1ff 50%, #eafcf5 100%);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 12px 30px rgba(180, 170, 230, 0.25);
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #6b5b95;
    margin: 0 0 24px;
  }

  #lock-screen input {
    width: 100%;
    border: 2px solid #f0e6f6;
    background: #fbf7fd;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 10px;
  }

  #lock-screen input:focus {
    border-color: #c9b6e4;
  }

  #lock-screen button,
  #memo-screen #add-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px;
    background: #b8a9e0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  #lock-screen button:hover,
  #memo-screen #add-btn:hover {
    background: #a390d6;
  }

  #lock-error {
    color: #c1507a;
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
    margin-bottom: 6px;
  }

  #memo-screen {
    display: none;
  }

  #memo-input {
    width: 100%;
    min-height: 70px;
    border: 2px solid #f0e6f6;
    background: #fbf7fd;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.95rem;
    outline: none;
    resize: vertical;
    margin-bottom: 10px;
    font-family: inherit;
  }

  #memo-list {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
  }

  #memo-list li {
    background: #faf6ff;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    color: #5c4b7a;
    word-break: break-word;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 비밀 메모장</h1>

    <div id="lock-screen">
      <input type="password" id="password-input" placeholder="비밀번호를 입력하세요">
      <p id="lock-error"></p>
      <button id="unlock-btn">잠금 해제</button>
    </div>

    <div id="memo-screen">
      <textarea id="memo-input" placeholder="메모를 입력하세요"></textarea>
      <button id="add-btn">메모 추가</button>
      <ul id="memo-list"></ul>
    </div>
  </div>

<script>
  // ① 비밀번호 하드코딩
  const CORRECT_PASSWORD = "1234";

  const passwordInput = document.getElementById('password-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const lockScreen = document.getElementById('lock-screen');
  const memoScreen = document.getElementById('memo-screen');
  const lockError = document.getElementById('lock-error');

  function tryUnlock() {
    const input = passwordInput.value;
    const isCorrect = input === CORRECT_PASSWORD;

    // ③ 비밀번호 확인 결과를 콘솔에 출력
    console.log('비밀번호 확인 결과:', isCorrect, '입력값:', input);

    if (isCorrect) {
      lockScreen.style.display = 'none';
      memoScreen.style.display = 'block';
      lockError.textContent = '';
    } else {
      lockError.textContent = '비밀번호가 틀렸습니다.';
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });

  const memoInput = document.getElementById('memo-input');
  const addBtn = document.getElementById('add-btn');
  const memoList = document.getElementById('memo-list');

  function addMemo() {
    const text = memoInput.value.trim();
    if (!text) return;

    const li = document.createElement('li');
    // ② 입력값을 escape 없이 innerHTML로 그대로 표시
    li.innerHTML = text;
    memoList.appendChild(li);

    memoInput.value = '';
  }

  addBtn.addEventListener('click', addMemo);
</script>
</body>
</html>
