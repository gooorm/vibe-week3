name: Daily Hello

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 9시 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: README.md의 오늘의 한마디 갱신
        run: |
          set -euo pipefail

          QUOTE=$(shuf -n 1 quotes.txt)

          awk -v q="$QUOTE" '
            /<!-- QUOTE_START -->/ { print; print q; skip=1; next }
            /<!-- QUOTE_END -->/   { skip=0 }
            skip { next }
            { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: 변경사항 커밋 및 푸시
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "변경 사항이 없어 커밋을 생략합니다."
          else
            git commit -m "chore: 오늘의 한마디 갱신 ($(date +'%Y-%m-%d'))"
            git push
          fi
