<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 가계부 분석기</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fdeff9 0%, #eef1ff 50%, #eafcf5 100%);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 12px 30px rgba(180, 170, 230, 0.25);
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    color: #6b5b95;
    margin: 0 0 4px;
  }

  .subtitle {
    text-align: center;
    color: #a99fc7;
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .input-row input {
    border: 2px solid #f0e6f6;
    background: #fbf7fd;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .input-row input:focus {
    border-color: #c9b6e4;
  }

  #item-name {
    flex: 1.3;
  }

  #item-amount {
    flex: 1;
  }

  #add-btn {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    background: #b8a9e0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  #add-btn:hover {
    background: #a390d6;
  }

  #add-btn:active {
    transform: scale(0.97);
  }

  ul#expense-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
  }

  ul#expense-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: #faf6ff;
    border-radius: 14px;
    margin-bottom: 8px;
  }

  li .name {
    flex: 1;
    color: #5c4b7a;
    font-weight: 500;
    word-break: break-all;
  }

  li .amount {
    color: #7c6aa8;
    font-weight: 700;
    white-space: nowrap;
  }

  li .delete-btn {
    border: none;
    background: #ffd9e6;
    color: #b5507a;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  li .delete-btn:hover {
    background: #ffc0d6;
  }

  .empty-message {
    text-align: center;
    color: #c9bfe0;
    font-size: 0.85rem;
    padding: 24px 0;
  }

  .total-row {
    margin-top: 20px;
    padding: 16px 18px;
    background: linear-gradient(135deg, #d9f2e6, #e4ebfb);
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.05rem;
  }

  .total-row .label {
    color: #4d8a72;
    font-weight: 600;
  }

  .total-row .value {
    color: #3d7a63;
    font-weight: 800;
    font-size: 1.25rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>미니 가계부 분석기</h1>
    <p class="subtitle">오늘의 지출을 가볍게 기록해보세요</p>

    <div class="input-row">
      <input type="text" id="item-name" placeholder="항목명 (예: 커피)">
      <input type="number" id="item-amount" placeholder="금액">
      <button id="add-btn">추가</button>
    </div>

    <ul id="expense-list"></ul>
    <p class="empty-message" id="empty-message">아직 등록된 항목이 없어요</p>

    <div class="total-row">
      <span class="label">합계</span>
      <span class="value" id="total-value">0원</span>
    </div>
  </div>

<script>
  const nameInput = document.getElementById('item-name');
  const amountInput = document.getElementById('item-amount');
  const addBtn = document.getElementById('add-btn');
  const listEl = document.getElementById('expense-list');
  const totalEl = document.getElementById('total-value');
  const emptyMessage = document.getElementById('empty-message');

  let expenses = [];

  function formatWon(num) {
    return num.toLocaleString('ko-KR') + '원';
  }

  function render() {
    listEl.innerHTML = '';
    emptyMessage.style.display = expenses.length === 0 ? 'block' : 'none';

    expenses.forEach((expense, index) => {
      const li = document.createElement('li');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'name';
      nameSpan.textContent = expense.name;

      const amountSpan = document.createElement('span');
      amountSpan.className = 'amount';
      amountSpan.textContent = formatWon(expense.amount);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => {
        expenses.splice(index, 1);
        render();
      });

      li.appendChild(nameSpan);
      li.appendChild(amountSpan);
      li.appendChild(deleteBtn);
      listEl.appendChild(li);
    });

    const total = expenses.reduce((sum, e) => sum + e.amount, 0);
    totalEl.textContent = formatWon(total);
  }

  function addExpense() {
    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if (!name) {
      alert('항목명을 입력해주세요.');
      nameInput.focus();
      return;
    }
    if (!amountInput.value || isNaN(amount) || amount <= 0) {
      alert('올바른 금액을 입력해주세요.');
      amountInput.focus();
      return;
    }

    expenses.push({ name, amount });
    nameInput.value = '';
    amountInput.value = '';
    nameInput.focus();
    render();
  }

  addBtn.addEventListener('click', addExpense);
  [nameInput, amountInput].forEach((input) => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addExpense();
    });
  });

  render();
</script>
</body>
</html>
